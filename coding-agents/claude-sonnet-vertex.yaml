name: claude-sonnet-vertex
runtime_family: claude
binary: claude
home_config_subdir: ".claude"
session_log_dir: "${QUORUM_AGENT_HOME}/.claude/projects"
session_log_glob: "**/*.jsonl"
normalizer: claude
# Sonnet on Vertex AI. Same provisioning path as claude-vertex (see that file
# for how CLAUDE_CODE_USE_VERTEX, CLOUD_ML_REGION, and
# ANTHROPIC_VERTEX_PROJECT_ID route auth through Google ADC); only the model
# differs. This is the Sonnet actor for hosts that have no direct
# ANTHROPIC_API_KEY, where the claude-sonnet config cannot start.
required_env:
  - CLAUDE_CODE_USE_VERTEX
  - CLOUD_ML_REGION
  - ANTHROPIC_VERTEX_PROJECT_ID
  - SUPERPOWERS_ROOT
max_time: 10m
project_prompt: claude.project-prompt.md
# The Vertex publisher model id (not the API alias "sonnet"). Verified against
# this fork's Vertex project with `claude --model claude-sonnet-4-5 -p ...`.
model: claude-sonnet-4-5
