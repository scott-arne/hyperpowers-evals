<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <style>
      .task-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .task {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Styling the label as a sibling of :checked keeps the done state in the
         checkbox itself, so no script is needed to track it. */
      .task input[type="checkbox"]:checked + .task__label {
        text-decoration: line-through;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <main>
      <ul class="task-list">
        <li class="task">
          <input type="checkbox" id="task-1">
          <label class="task__label" for="task-1">Write the checkbox component</label>
        </li>
        <li class="task">
          <input type="checkbox" id="task-2">
          <label class="task__label" for="task-2">Mark a task as done</label>
        </li>
      </ul>
    </main>
  </body>
</html>
