<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="filters" id="activity-filters" hidden>
      <fieldset>
        <legend>Filter events</legend>
        <div class="field">
          <label for="filter-type">Event type</label>
          <select id="filter-type">
            <option value="">All events</option>
            <option>API token used</option>
            <option>Email change requested</option>
            <option>Password changed</option>
            <option>Session expired</option>
            <option>Settings updated</option>
            <option>Sign-in</option>
            <option>Sign-in failed</option>
            <option>Sign-out</option>
            <option>Two-factor enabled</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-preset">Date range</label>
          <select id="filter-preset">
            <option value="">Any time</option>
            <option value="1">Last 24 hours</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="custom" hidden>Custom range</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-from">From</label>
          <input type="date" id="filter-from" aria-describedby="filter-range-error">
        </div>
        <div class="field">
          <label for="filter-to">To</label>
          <input type="date" id="filter-to" aria-describedby="filter-range-error">
        </div>
        <div class="field field-check">
          <input type="checkbox" id="filter-failed">
          <label for="filter-failed">Failed sign-ins only</label>
        </div>
        <p class="field-error" id="filter-range-error" hidden>Start date must be on or before the end date</p>
      </fieldset>
    </form>

    <p class="filter-status" id="activity-status" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
