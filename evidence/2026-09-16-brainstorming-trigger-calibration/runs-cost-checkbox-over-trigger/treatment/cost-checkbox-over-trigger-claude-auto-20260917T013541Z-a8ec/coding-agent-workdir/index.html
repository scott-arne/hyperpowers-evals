<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <style>
      .task {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Styling the label off :checked keeps the done state in CSS, no script. */
      .task input:checked + label {
        text-decoration: line-through;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <main>
      <div class="task">
        <input type="checkbox" id="task-1">
        <label for="task-1">Write the tasks page</label>
      </div>
    </main>
  </body>
</html>
