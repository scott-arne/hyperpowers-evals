<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="activity-filters" id="activity-filters" hidden>
      <div class="activity-filters-shortcuts">
        <button type="button" class="filter-button" data-shortcut="failed" aria-pressed="false">Failed sign-ins</button>
        <button type="button" class="filter-button" data-shortcut="security" aria-pressed="false">Security changes</button>
      </div>
      <div class="activity-filters-field">
        <label for="filter-type">Event type</label>
        <select id="filter-type">
          <option value="all">All events</option>
          <optgroup label="Shortcuts">
            <option value="failed">Failed sign-ins</option>
            <option value="security">Security changes</option>
          </optgroup>
          <optgroup label="Event types">
            <option>Sign-in</option>
            <option>Sign-in failed</option>
            <option>Sign-out</option>
            <option>Session expired</option>
            <option>Password changed</option>
            <option>Two-factor enabled</option>
            <option>Email change requested</option>
            <option>Settings updated</option>
            <option>API token used</option>
          </optgroup>
        </select>
      </div>
      <div class="activity-filters-field">
        <label for="filter-preset">Dates</label>
        <select id="filter-preset">
          <option value="all">Last 90 days</option>
          <option value="this-week">This week</option>
          <option value="last-week">Last week</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="activity-filters-field">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from" aria-describedby="filter-date-error">
      </div>
      <div class="activity-filters-field">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to" aria-describedby="filter-date-error">
      </div>
      <button type="button" class="filter-button" id="filter-clear">Clear filters</button>
      <p class="activity-filters-error" id="filter-date-error" hidden>The end date must be after the start date.</p>
      <p class="activity-filters-count" id="activity-count" role="status"></p>
    </form>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
