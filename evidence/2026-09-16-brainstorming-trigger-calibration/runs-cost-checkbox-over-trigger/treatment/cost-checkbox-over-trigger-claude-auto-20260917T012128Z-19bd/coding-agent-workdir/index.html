<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <style>
      .task input:checked + span {
        text-decoration: line-through;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <main>
      <label class="task">
        <input type="checkbox">
        <span>Write the task list</span>
      </label>
    </main>
  </body>
</html>
