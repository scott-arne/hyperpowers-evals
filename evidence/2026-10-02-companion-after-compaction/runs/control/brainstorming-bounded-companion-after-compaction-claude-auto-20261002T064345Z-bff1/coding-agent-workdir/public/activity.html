<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <div class="filters" id="filters" hidden>
      <div class="filters-bar">
        <button type="button" class="filter-button" data-shortcut="failed" aria-pressed="false">Failed sign-ins</button>
        <button type="button" class="filter-button" data-shortcut="security" aria-pressed="false">Security changes</button>
        <div class="filter-anchor">
          <button type="button" class="filter-button" id="filter-toggle" aria-expanded="false" aria-controls="filter-panel">Filter</button>
          <div class="filter-panel" id="filter-panel" role="dialog" aria-labelledby="filter-panel-title" hidden>
            <h2 class="filter-panel-title" id="filter-panel-title">Filter events</h2>
            <fieldset class="filter-types">
              <legend>Event type</legend>
              <label><input type="checkbox" name="type" value="Sign-in" checked> Sign-in</label>
              <label><input type="checkbox" name="type" value="Sign-in failed" checked> Sign-in failed</label>
              <label><input type="checkbox" name="type" value="Sign-out" checked> Sign-out</label>
              <label><input type="checkbox" name="type" value="Session expired" checked> Session expired</label>
              <label><input type="checkbox" name="type" value="Password changed" checked> Password changed</label>
              <label><input type="checkbox" name="type" value="Two-factor enabled" checked> Two-factor enabled</label>
              <label><input type="checkbox" name="type" value="Email change requested" checked> Email change requested</label>
              <label><input type="checkbox" name="type" value="Settings updated" checked> Settings updated</label>
              <label><input type="checkbox" name="type" value="API token used" checked> API token used</label>
            </fieldset>
            <div class="filter-field">
              <label for="filter-preset">Date range</label>
              <select id="filter-preset">
                <option value="">Custom</option>
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="90">All 90 days</option>
              </select>
            </div>
            <p class="filter-hint" id="filter-date-hint">Dates are in your time zone</p>
            <div class="filter-dates">
              <div class="filter-field">
                <label for="filter-from">From</label>
                <input type="date" id="filter-from" aria-describedby="filter-date-hint">
              </div>
              <div class="filter-field">
                <label for="filter-to">To</label>
                <input type="date" id="filter-to" aria-describedby="filter-date-hint">
                <p class="filter-error" id="filter-to-error" hidden>The end date must be after the start date.</p>
              </div>
            </div>
            <button type="button" class="filter-button" id="filter-close">Close</button>
          </div>
        </div>
      </div>
      <ul class="filter-tags" id="filter-tags" aria-label="Active filters"></ul>
      <button type="button" class="filter-button" id="filter-clear" hidden>Clear filters</button>
      <p class="filter-count" id="filter-count" role="status"></p>
    </div>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
