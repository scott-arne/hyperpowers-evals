<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <style>
      /* Reflect the checked state on the label text. */
      input:checked + span {
        text-decoration: line-through;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <main>
      <label>
        <input type="checkbox">
        <span>Task</span>
      </label>
    </main>
  </body>
</html>
