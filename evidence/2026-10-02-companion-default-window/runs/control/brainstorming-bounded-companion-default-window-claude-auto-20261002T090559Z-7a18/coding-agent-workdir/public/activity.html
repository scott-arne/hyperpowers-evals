<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="activity-filters" id="activity-filters" hidden>
      <div class="activity-filter">
        <label for="filter-type">Events</label>
        <select id="filter-type" name="type">
          <option value="">All events</option>
          <option value="group:failed">Failed sign-ins</option>
          <option value="group:security">Security changes</option>
          <optgroup label="Event type">
            <option value="type:Sign-in">Sign-in</option>
            <option value="type:Sign-in failed">Sign-in failed</option>
            <option value="type:Sign-out">Sign-out</option>
            <option value="type:Session expired">Session expired</option>
            <option value="type:Password changed">Password changed</option>
            <option value="type:Two-factor enabled">Two-factor enabled</option>
            <option value="type:Email change requested">Email change requested</option>
            <option value="type:Settings updated">Settings updated</option>
            <option value="type:API token used">API token used</option>
          </optgroup>
        </select>
      </div>
      <div class="activity-filter">
        <label for="filter-week">Week</label>
        <select id="filter-week" name="week">
          <option value="">Any time</option>
        </select>
      </div>
    </form>
    <p class="activity-status" id="activity-status" role="status"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity-filters.js"></script>
  <script src="activity.js"></script>
</body>
</html>
