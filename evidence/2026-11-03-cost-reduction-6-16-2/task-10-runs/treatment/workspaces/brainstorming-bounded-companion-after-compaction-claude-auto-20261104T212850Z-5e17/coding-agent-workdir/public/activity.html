<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <section class="filters" aria-label="Filters" hidden>
      <div class="quick-views" role="group" aria-labelledby="quick-views-label">
        <span class="field-label" id="quick-views-label">Quick views</span>
        <div class="button-row">
          <button type="button" class="button" data-view="all" aria-pressed="true">All activity</button>
          <button type="button" class="button" data-view="failed" aria-pressed="false">Failed sign-ins</button>
          <button type="button" class="button" data-view="changes" aria-pressed="false">Account changes</button>
        </div>
      </div>

      <fieldset class="types">
        <legend class="field-label">Event type</legend>
        <div class="checkbox-list"></div>
      </fieldset>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="filter-from">From</label>
          <input type="date" id="filter-from">
        </div>
        <div class="field">
          <label class="field-label" for="filter-to">To</label>
          <input type="date" id="filter-to" aria-describedby="filter-to-error">
          <p class="field-error" id="filter-to-error" hidden>The end date must be after the start date.</p>
        </div>
        <div class="field">
          <label class="field-label" for="filter-preset">Date range</label>
          <select id="filter-preset">
            <option value="custom">Custom</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90" selected>Last 90 days</option>
          </select>
        </div>
      </div>

      <div class="status-row">
        <p class="filter-status" id="filter-status" role="status"></p>
        <button type="button" class="button" id="filter-clear">Clear filters</button>
      </div>
    </section>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
