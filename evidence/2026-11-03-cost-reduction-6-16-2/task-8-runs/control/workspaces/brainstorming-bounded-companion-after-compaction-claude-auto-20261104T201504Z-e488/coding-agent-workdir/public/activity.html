<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="activity-filters" id="activity-filters" aria-label="Filter activity" hidden>
      <div class="activity-filters__field">
        <label for="filter-type">Event type</label>
        <select id="filter-type" name="type">
          <option value="">All events</option>
          <option>Sign-in</option>
          <option>Sign-in failed</option>
          <option>Sign-out</option>
          <option>Session expired</option>
          <option>Password changed</option>
          <option>Two-factor enabled</option>
          <option>Email change requested</option>
          <option>Settings updated</option>
          <option>API token used</option>
        </select>
      </div>
      <div class="activity-filters__field">
        <label for="filter-search">Search</label>
        <div class="activity-filters__search">
          <input type="search" id="filter-search" name="q" size="32"
                 enterkeyhint="search" autocomplete="off">
          <button type="button" class="activity-filters__clear" id="filter-search-clear"
                  aria-label="Clear search" title="Clear search" hidden>&times;</button>
        </div>
      </div>
      <label class="activity-filters__check">
        <input type="checkbox" id="filter-failed" name="failed">
        Failed sign-ins only
      </label>
    </form>
    <p class="activity-count" id="activity-count" role="status" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
