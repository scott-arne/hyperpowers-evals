<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <!-- Revealed by activity.js; filtering needs JavaScript. -->
    <form id="activity-filters" class="activity-filters" hidden>
      <fieldset>
        <legend>Event type</legend>
        <div class="filter-types">
          <label><input type="checkbox" name="type" value="Sign-in"> Sign-in</label>
          <label><input type="checkbox" name="type" value="Sign-in failed"> Sign-in failed</label>
          <label><input type="checkbox" name="type" value="Sign-out"> Sign-out</label>
          <label><input type="checkbox" name="type" value="Session expired"> Session expired</label>
          <label><input type="checkbox" name="type" value="Password changed"> Password changed</label>
          <label><input type="checkbox" name="type" value="Two-factor enabled"> Two-factor enabled</label>
          <label><input type="checkbox" name="type" value="Email change requested"> Email change requested</label>
          <label><input type="checkbox" name="type" value="Settings updated"> Settings updated</label>
          <label><input type="checkbox" name="type" value="API token used"> API token used</label>
        </div>
      </fieldset>

      <p id="filter-zone-hint" class="filter-hint">Dates are in your time zone</p>
      <div class="filter-dates">
        <div class="field">
          <label for="filter-period">Period</label>
          <select id="filter-period" name="period">
            <option value="90" selected>Last 90 days</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="custom">Custom range</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-from">From</label>
          <input type="date" id="filter-from" name="from" aria-describedby="filter-zone-hint">
        </div>
        <div class="field">
          <label for="filter-to">To</label>
          <input type="date" id="filter-to" name="to" aria-describedby="filter-zone-hint filter-to-message">
          <p id="filter-to-message" class="field-message"></p>
        </div>
      </div>
      <button type="reset" class="button-secondary">Clear filters</button>
    </form>
    <p id="filter-status" class="filter-status" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
