<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="filters" id="activity-filters" role="search" aria-label="Filter events" hidden>
      <div class="field">
        <label for="filter-type">Event type</label>
        <select id="filter-type">
          <option value="">All events</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from">
      </div>
      <div class="field">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to" aria-describedby="filter-date-error">
      </div>
      <div class="field field-search">
        <label for="filter-search">Search</label>
        <div class="search-box">
          <input type="search" id="filter-search" placeholder="Device, location, IP, or details" enterkeyhint="search" autocomplete="off">
          <button type="button" class="search-clear" id="filter-search-clear" aria-label="Clear search" hidden>&times;</button>
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="button" id="filter-failed">Show failed sign-ins</button>
        <button type="button" class="button" id="filter-reset">Clear filters</button>
      </div>
      <p class="field-error" id="filter-date-error" hidden></p>
    </form>

    <p class="filter-status" id="activity-status" role="status"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="empty-state" id="activity-empty" hidden>
      <h2>No matching events</h2>
      <p>Try a different event type, date range, or search.</p>
    </div>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
