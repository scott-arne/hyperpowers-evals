<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <!-- Hidden until activity.js runs, so there are no dead controls without JS. -->
    <form class="filters" id="activity-filters" role="search" aria-label="Filter activity" hidden>
      <div class="field">
        <label for="filter-type">Event</label>
        <select id="filter-type">
          <option value="all">All events</option>
          <option value="security">All security changes</option>
          <optgroup label="Sign-ins">
            <option>Sign-in</option>
            <option>Sign-in failed</option>
            <option>Sign-out</option>
            <option>Session expired</option>
          </optgroup>
          <optgroup label="Account changes">
            <option>Password changed</option>
            <option>Two-factor enabled</option>
            <option>Email change requested</option>
            <option>Settings updated</option>
            <option>API token used</option>
          </optgroup>
        </select>
      </div>

      <fieldset class="field date-range">
        <legend>Date range</legend>
        <div class="date-fields">
          <div class="field">
            <label for="filter-range">Range</label>
            <select id="filter-range">
              <option value="any">Any time</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="field">
            <label for="filter-from">From</label>
            <input type="date" id="filter-from">
          </div>
          <div class="field">
            <label for="filter-to">To</label>
            <input type="date" id="filter-to">
          </div>
        </div>
        <p class="field-error" id="filter-date-error" hidden>The end date must be after the start date.</p>
      </fieldset>

      <div class="field">
        <label for="filter-search">Search</label>
        <div class="search-box">
          <input type="search" id="filter-search" autocomplete="off" enterkeyhint="search"
                 placeholder="Device, location, IP or details">
          <button type="button" class="search-clear" id="filter-search-clear" aria-label="Clear search" hidden>&times;</button>
        </div>
      </div>
    </form>

    <p class="filter-count" id="activity-count" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
