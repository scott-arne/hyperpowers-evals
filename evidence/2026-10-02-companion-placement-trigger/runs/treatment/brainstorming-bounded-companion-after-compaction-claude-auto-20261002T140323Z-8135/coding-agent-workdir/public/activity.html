<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form id="activity-filters" class="activity-filters" aria-label="Filter activity" hidden>
      <div class="filter-field">
        <label for="filter-event">Event</label>
        <select id="filter-event">
          <option value="all">All events</option>
          <option value="failed">Failed sign-ins</option>
          <option value="security">Security changes</option>
          <optgroup label="Event type">
            <option>Sign-in</option>
            <option>Sign-in failed</option>
            <option>Sign-out</option>
            <option>Session expired</option>
            <option>Password changed</option>
            <option>Two-factor enabled</option>
            <option>Email change requested</option>
            <option>Settings updated</option>
            <option>API token used</option>
          </optgroup>
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-preset">Date range</label>
        <select id="filter-preset">
          <option value="any">Any time</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from" aria-describedby="filter-date-error">
      </div>
      <div class="filter-field">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to" aria-describedby="filter-date-error">
      </div>
      <button type="button" id="filter-clear" class="button-secondary">Clear filters</button>
      <p id="filter-date-error" class="filter-error" aria-live="polite"></p>
    </form>
    <p id="filter-status" class="filter-status" role="status"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
