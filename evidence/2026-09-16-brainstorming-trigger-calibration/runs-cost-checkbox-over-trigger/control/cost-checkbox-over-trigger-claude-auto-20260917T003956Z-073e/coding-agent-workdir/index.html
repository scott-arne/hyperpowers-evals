<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <style>
      /* Give "done" a visible signal beyond the box itself. */
      label:has(:checked) {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <main>
      <label>
        <input type="checkbox">
        Example task
      </label>
    </main>
  </body>
</html>
