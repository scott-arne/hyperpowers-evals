<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="filters" id="activity-filters" hidden>
      <div class="filter">
        <label for="filter-group">Show</label>
        <select id="filter-group">
          <option value="all">All events</option>
          <option value="failed">Failed sign-ins</option>
          <option value="security">Security changes</option>
          <option value="failed-security">Failed sign-ins and security changes</option>
        </select>
      </div>
      <div class="filter">
        <label for="filter-week">Week</label>
        <select id="filter-week">
          <option value="">All 90 days</option>
        </select>
      </div>
    </form>
    <p class="filter-status" id="filter-status" role="status" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity-filters.js"></script>
  <script src="activity.js"></script>
</body>
</html>
