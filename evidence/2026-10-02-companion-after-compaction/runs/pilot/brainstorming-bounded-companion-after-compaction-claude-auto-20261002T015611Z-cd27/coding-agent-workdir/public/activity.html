<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <form class="activity-filters" id="activity-filters" hidden>
      <fieldset class="activity-filters__show">
        <legend>Show</legend>
        <label><input type="radio" name="show" value="all" checked> All events</label>
        <label><input type="radio" name="show" value="failed"> Failed sign-ins</label>
        <label><input type="radio" name="show" value="security"> Security changes</label>
      </fieldset>
      <div class="activity-filters__field">
        <label for="activity-week">Week</label>
        <select id="activity-week" name="week">
          <option value="">All 90 days</option>
        </select>
      </div>
      <button type="reset" class="activity-filters__clear">Clear filters</button>
    </form>
    <p class="activity-count" id="activity-count" aria-live="polite"></p>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="activity-empty" id="activity-empty" hidden>
      <p class="activity-empty__title">No events match these filters</p>
      <p>Try another week or show all events.</p>
      <button type="button" id="activity-empty-clear">Clear filters</button>
    </div>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity.js"></script>
</body>
</html>
