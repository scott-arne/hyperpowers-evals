<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account activity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <main class="activity">
    <h1>Account activity</h1>
    <p class="intro">Every sign-in and account change from the last 90 days, newest first.</p>

    <!-- Shown by activity.js; without JavaScript the controls would do nothing. -->
    <form class="activity-filters" id="activity-filters" hidden>
      <div class="filter-row">
        <div class="filter-field">
          <label for="filter-search">Search device or location</label>
          <div class="filter-search">
            <input id="filter-search" type="search" enterkeyhint="search" autocomplete="off">
            <button type="button" class="button-quiet" id="filter-search-clear" hidden>Clear search</button>
          </div>
        </div>
        <div class="filter-field">
          <label for="filter-week">Week</label>
          <select id="filter-week">
            <option value="">All 90 days</option>
          </select>
        </div>
      </div>

      <fieldset class="filter-types" aria-describedby="filter-types-hint">
        <legend>Event type</legend>
        <p class="filter-hint" id="filter-types-hint">Leave every box unticked to show all types.</p>
        <div class="filter-type-list">
          <label><input type="checkbox" name="type" value="Sign-in"> Sign-in</label>
          <label><input type="checkbox" name="type" value="Sign-in failed"> Sign-in failed</label>
          <label><input type="checkbox" name="type" value="Sign-out"> Sign-out</label>
          <label><input type="checkbox" name="type" value="Session expired"> Session expired</label>
          <label><input type="checkbox" name="type" value="Password changed"> Password changed</label>
          <label><input type="checkbox" name="type" value="Two-factor enabled"> Two-factor enabled</label>
          <label><input type="checkbox" name="type" value="Email change requested"> Email change requested</label>
          <label><input type="checkbox" name="type" value="Settings updated"> Settings updated</label>
          <label><input type="checkbox" name="type" value="API token used"> API token used</label>
        </div>
      </fieldset>

      <div class="filter-status">
        <p id="filter-count" role="status"></p>
        <button type="button" class="button-secondary" id="filter-clear">Clear filters</button>
      </div>
    </form>

    <table id="activity-table">
      <thead>
        <tr>
          <th>When</th>
          <th>Event</th>
          <th>Device</th>
          <th>Location</th>
          <th>IP</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="activity-data.js"></script>
  <script src="activity-filter.js"></script>
  <script src="activity.js"></script>
</body>
</html>
